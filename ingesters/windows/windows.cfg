[Global]
Ingest-Secret = IngestSecrets
Connection-Timeout = 0
Insecure-Skip-TLS-Verify = true
#note that backslashes (\) are an escape character and must be escaped themselves
Cleartext-Backend-Target=127.0.1.1:4023 #example of adding a cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
#Ingest-Cache-Path="C:\\ProgramData\\gravwell\\windows\\windows.cache"
#Max-Ingest-Cache=1024 #Number of MB to store
Log-Level=INFO
#Bookmark-Location="C:\\ProgramData\\gravwell\\windows\\bookmark"
#State-Store-Location="C:\\ProgramData\\gravwell\\windows\\file_follow.state"
Max-Files-Watched=64

############# Windows Event Log channels #############
[EventChannel "system"]
	Tag-Name=windows
	Channel=System

[EventChannel "application"]
	Tag-Name=windows
	Channel=Application

[EventChannel "security"]
	Tag-Name=windows
	Channel=Security

#[EventChannel "sysmon"]
#	Tag-Name=sysmon
#	Channel="Microsoft-Windows-Sysmon/Operational"
#	Max-Reachback=24h

############# File followers #############
#[Follower "cbs"]
#	Base-Directory="C:\\Windows\\Logs\\CBS"
#	File-Filter="*.log"
#	Tag-Name=cbs
#	Assume-Local-Timezone=true

############# ETW (Event Tracing for Windows) sessions #############
# Each section is one real-time ETW session; events are rendered as JSON.
# Provider may be a registered provider name or a GUID, and may be repeated.
# Level: critical, error, warning, information, verbose (default) or 0-255
# Match-Any-Keyword / Match-All-Keyword: numeric masks or manifest keyword names
# Event-ID: event IDs to accept (e.g. 1, 1-10, 4688,4689), at most 64
[ETW "process"]
	Tag-Name=etw
	Provider=Microsoft-Windows-Kernel-Process
	Level=information
	Match-Any-Keyword=0x10 #WINEVENT_KEYWORD_PROCESS

